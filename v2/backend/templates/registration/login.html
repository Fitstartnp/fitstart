<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · FitStart</title>
  <style>
    :root{color-scheme:light;--ink:#24201d;--paper:#f3ece1;--card:#fbf8f3;--line:#d8cbb8;--teal:#2d6a6e}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);font:16px system-ui,sans-serif;color:var(--ink)}
    main{width:min(100%,420px);padding:32px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 16px 50px #24201d12}
    h1{margin:0 0 6px;font-size:2rem}p{color:#625950;line-height:1.5}label{display:block;margin:14px 0 6px;font-weight:600;font-size:.9rem}
    input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:var(--teal);color:white;font:inherit;font-weight:700;cursor:pointer}
    .errorlist{color:#9b2929;padding-left:18px}.muted{font-size:.85rem;text-align:center;margin-top:20px}.muted a{color:var(--teal)}
  </style>
</head>
<body>
<main>
  <h1>FitStart</h1>
  <p>Sign in to your personal fitness and nutrition space.</p>
  {% if form.errors %}<p role="alert">Your email or password was not accepted. Please try again.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Email</label>
    <input id="id_username" name="username" type="email" autocomplete="username" required autofocus>
    <label for="id_password">Password</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
  <p class="muted"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
  <p class="muted">Accounts are invitation-only during the private beta.</p>
</main>
</body>
</html>
