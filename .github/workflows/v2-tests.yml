name: FitStart V2 checks

on:
  push:
    branches:
      - v2-platform
  pull_request:
    branches:
      - main
      - v2-platform

concurrency:
  group: fitstart-v2-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fitstart_test
          POSTGRES_USER: fitstart
          POSTGRES_PASSWORD: fitstart-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitstart -d fitstart_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: v2/backend
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-only-not-a-production-secret-change-before-deploy"
      DB_NAME: fitstart_test
      DB_USER: fitstart
      DB_PASSWORD: fitstart-ci-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/backend/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check browser JavaScript syntax
        run: node --check static/fitstart/app.js
      - name: Check Django configuration
        run: python manage.py check
      - name: Check production security configuration
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-only-production-check-secret-with-more-than-fifty-characters-123456"
          DJANGO_ALLOWED_HOSTS: "fitstart.example.test"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://fitstart.example.test"
          DJANGO_SECURE_COOKIES: "true"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_HSTS_SECONDS: "31536000"
          EMAIL_HOST: "smtp.example.test"
          EMAIL_PORT: "587"
          EMAIL_HOST_USER: "ci-placeholder"
          EMAIL_HOST_PASSWORD: "ci-placeholder-not-a-real-credential"
          EMAIL_USE_TLS: "true"
          DEFAULT_FROM_EMAIL: "FitStart <no-reply@fitstart.example.test>"
          FITSTART_PUBLIC_URL: "https://fitstart.example.test"
        run: python manage.py check --deploy
      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations to PostgreSQL
        run: python manage.py migrate --noinput
      - name: Run account, household and API tests
        run: python manage.py test
