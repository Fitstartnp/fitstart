name: FitStart V2 checks

on:
  push:
    branches:
      - v2-platform
  pull_request:
    branches:
      - main
      - v2-platform

concurrency:
  group: fitstart-v2-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/backend
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "test-only-not-a-production-secret"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations to test database
        run: python manage.py migrate --noinput
      - name: Run account, household and API tests
        run: python manage.py test
